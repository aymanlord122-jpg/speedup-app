name: Build SpeedUp APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.3'
      - name: Create project
        shell: cmd
        run: flutter create --project-name internet_checker --org com.speedup speedup_app
      - name: Copy SpeedUp files
        shell: cmd
        run: |
          copy /y src\pubspec.yaml speedup_app\pubspec.yaml
          copy /y src\main.dart speedup_app\lib\main.dart
          if exist speedup_app\test\widget_test.dart del /q speedup_app\test\widget_test.dart
      - name: Patch Android
        shell: pwsh
        run: ./src/patch_android.ps1 -Project speedup_app
      - name: Build APK
        shell: cmd
        run: |
          cd speedup_app
          flutter pub get
          flutter build apk --release --split-per-abi
      - name: Rename
        shell: cmd
        run: copy /y speedup_app\build\app\outputs\flutter-apk\app-arm64-v8a-release.apk speedup.apk
      - uses: actions/upload-artifact@v4
        with:
          name: speedup-apk
          path: speedup.apk
